name: Odoo tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: odoo_test
    steps:
      - uses: actions/checkout@v4
      - name: Build development environment
        run: docker compose build
      - name: Install module and run PostgreSQL tests
        run: >-
          docker compose run --rm odoo
          --addons-path=/opt/odoo/addons,/mnt/extra-addons
          --data-dir=/var/lib/odoo --db_host=db --db_user=odoo
          -d trustgate -i trustgate --without-demo=all
          --test-enable --test-tags=/trustgate --stop-after-init --log-level=test
      - name: Verify web startup
        run: |
          docker compose up -d
          python scripts/check_startup.py
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop development environment
        if: always()
        run: docker compose down
